<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reborn新生留学 · 雅思听力默写</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --color-main-green: #2E5938;
            --color-aux-beige: #F2E9D2;
            --color-page-bg: #F8F7F0;
            --color-card-bg: #F5F4EB;
            --color-input-bg: #FFFFFF;
            --color-text-dark: #222222;
            --color-text-placeholder: #999999;
            --color-error: #b13e3e;
            --radius-card: 24px;
            --radius-btn: 16px;
            --radius-input: 12px;
            --radius-tag: 999px;
            --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-btn: 0 1px 3px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans SC', sans-serif;
            background-color: var(--color-page-bg);
            color: var(--color-text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .app-container {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .brand-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 26px 20px 20px;
            text-align: center;
        }
        .brand-card h1 {
            font-size: 30px;
            font-weight: 700;
            color: var(--color-main-green);
            letter-spacing: 2px;
        }
        .brand-card .sub {
            font-size: 16px;
            font-weight: 300;
            color: var(--color-text-placeholder);
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--color-main-green);
            color: #fff;
            padding: 12px 28px;
            border-radius: var(--radius-tag);
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 999;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .password-section {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 24px 20px;
            text-align: center;
        }
        .password-section .lock-icon { font-size: 28px; margin-bottom: 8px; }
        .password-section .prompt {
            font-size: 15px;
            color: var(--color-text-placeholder);
            margin-bottom: 14px;
        }
        .password-row {
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 360px;
            margin: 0 auto;
        }
        .password-row input {
            flex: 1;
            padding: 14px 18px;
            background: var(--color-input-bg);
            border: 1.5px solid #ddd;
            border-radius: var(--radius-input);
            font-size: 18px;
            color: var(--color-text-dark);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
            letter-spacing: 4px;
        }
        .password-row input:focus {
            border-color: var(--color-main-green);
            box-shadow: 0 0 0 3px rgba(46,89,56,0.12);
        }
        .password-row input.error {
            border-color: var(--color-error);
            box-shadow: 0 0 0 3px rgba(177,62,62,0.12);
        }
        .password-row .btn-unlock {
            background: var(--color-main-green);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 16px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
            white-space: nowrap;
        }
        .password-row .btn-unlock:hover { background: #1f452b; }
        .password-row .btn-unlock:active { transform: scale(0.97); }
        .password-error {
            color: var(--color-error);
            font-size: 14px;
            margin-top: 10px;
            min-height: 22px;
        }
        .password-success {
            display: none;
            color: var(--color-main-green);
            font-size: 15px;
            font-weight: 500;
            margin-top: 6px;
        }
        .password-success.show { display: block; }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--color-text-placeholder);
            color: var(--color-text-placeholder);
            padding: 4px 16px;
            border-radius: var(--radius-tag);
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
            margin-top: 8px;
        }
        .btn-logout:hover {
            border-color: var(--color-main-green);
            color: var(--color-main-green);
        }

        .pronounce-section {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 20px 24px 24px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .badge {
            background: var(--color-main-green);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: var(--radius-tag);
        }
        .section-title .count {
            font-size: 14px;
            font-weight: 400;
            color: var(--color-text-placeholder);
            margin-left: auto;
        }
        .pronounce-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-accent {
            background: #fff;
            border: 1.5px solid #ddd;
            color: var(--color-text-placeholder);
            padding: 8px 28px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .btn-accent:hover {
            border-color: var(--color-main-green);
            color: var(--color-main-green);
        }
        .btn-accent.active {
            background: var(--color-main-green);
            color: #fff;
            border-color: var(--color-main-green);
        }

        .unit-section {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 20px 24px 24px;
        }
        .part-group { margin-bottom: 6px; }
        .part-group:last-child { margin-bottom: 0; }
        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #fff;
            border-radius: var(--radius-input);
            cursor: pointer;
            transition: 0.15s;
            box-shadow: var(--shadow-btn);
            border: 1px solid #eee;
        }
        .part-header:hover { border-color: var(--color-main-green); }
        .part-header .part-name { font-weight: 600; font-size: 15px; }
        .part-header .part-meta {
            font-size: 13px;
            color: var(--color-text-placeholder);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .part-header .part-meta .arrow {
            transition: transform 0.25s;
            font-size: 14px;
        }
        .part-header .part-meta .arrow.open { transform: rotate(180deg); }
        .part-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            padding: 0 4px;
        }
        .part-body.open { max-height: 1200px; }
        .unit-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 12px 8px 4px;
        }
        .unit-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            padding: 6px 14px 6px 12px;
            border-radius: var(--radius-tag);
            font-size: 14px;
            box-shadow: var(--shadow-btn);
            border: 1px solid #eaeaea;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }
        .unit-chip:hover { border-color: var(--color-main-green); }
        .unit-chip input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--color-main-green);
            cursor: pointer;
            flex-shrink: 0;
        }
        .unit-chip .unit-label { cursor: pointer; }

        .start-section {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 20px 24px 24px;
            text-align: center;
        }
        .btn-start {
            background: var(--color-main-green);
            color: #fff;
            border: none;
            padding: 16px 56px;
            border-radius: var(--radius-btn);
            font-size: 20px;
            font-weight: 700;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, opacity 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .btn-start:hover:not(:disabled) { background: #1f452b; }
        .btn-start:active:not(:disabled) { transform: scale(0.97); }
        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .start-hint {
            font-size: 14px;
            color: var(--color-text-placeholder);
            margin-top: 10px;
        }

        .hidden { display: none !important; }

        @media (max-width: 500px) {
            .brand-card h1 { font-size: 24px; }
            .password-row { flex-wrap: wrap; }
            .password-row input { width: 100%; }
            .password-row .btn-unlock { width: 100%; justify-content: center; }
            .pronounce-section, .unit-section, .start-section { padding: 16px; }
            .unit-chip { font-size: 13px; padding: 5px 10px 5px 8px; }
            .btn-start { padding: 14px 32px; font-size: 18px; width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="toast" id="toast"></div>

    <!-- 品牌 -->
    <div class="brand-card">
        <h1>Reborn新生留学</h1>
        <div class="sub">天天进步 · 每日新生</div>
    </div>

    <!-- 密码 -->
    <div class="password-section" id="passwordSection">
        <div class="lock-icon" id="lockIcon">🔒</div>
        <div class="prompt" id="passwordPrompt">请输入密码访问</div>
        <div class="password-row">
            <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="off">
            <button class="btn-unlock" id="unlockBtn">解锁</button>
        </div>
        <div class="password-error" id="passwordError"></div>
        <div class="password-success" id="passwordSuccess">✅ 已解锁，请选择单元开始练习</div>
        <button class="btn-logout hidden" id="logoutBtn">退出</button>
    </div>

    <!-- 发音选择 -->
    <div class="pronounce-section hidden" id="pronounceSection">
        <div class="section-title">① 发音选择 <span class="badge">英音 / 美音</span></div>
        <div class="pronounce-group">
            <button class="btn-accent active" data-accent="uk">🇬🇧 英音</button>
            <button class="btn-accent" data-accent="us">🇺🇸 美音</button>
        </div>
    </div>

    <!-- 单元选择 -->
    <div class="unit-section hidden" id="unitSection">
        <div class="section-title">② 选择单元 <span class="count" id="unitCount">已选 0 个单元</span></div>
        <div id="partContainer"></div>
    </div>

    <!-- 开始按钮 -->
    <div class="start-section hidden" id="startSection">
        <button class="btn-start" id="startBtn" disabled>开始默写</button>
        <div class="start-hint">每次随机抽取 25 个词 · 15 秒倒计时</div>
    </div>
</div>

<script>
    // 密码
    const CORRECT_PASSWORD = 'reborn2026';
    let isUnlocked = false;
    let selectedUnits = new Set();
    let accent = 'uk';
    let toastTimer = null;

    const toast = document.getElementById('toast');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const passwordError = document.getElementById('passwordError');
    const passwordSuccess = document.getElementById('passwordSuccess');
    const logoutBtn = document.getElementById('logoutBtn');
    const lockIcon = document.getElementById('lockIcon');
    const passwordPrompt = document.getElementById('passwordPrompt');
    const pronounceSection = document.getElementById('pronounceSection');
    const unitSection = document.getElementById('unitSection');
    const startSection = document.getElementById('startSection');
    const partContainer = document.getElementById('partContainer');
    const unitCount = document.getElementById('unitCount');
    const startBtn = document.getElementById('startBtn');

    function showToast(msg, duration = 2000) {
        if (toastTimer) { clearTimeout(toastTimer); toast.classList.remove('show'); }
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, duration);
    }

    // Part 分组
    const PART_GROUPS = [
        { id: 'part1', label: 'Part 1 · 生活场景', units: [
            '1-1-1','1-1-2','1-2-1','1-2-2','1-2-3',
            '1-3-1','1-3-2','1-3-3','1-3-4',
            '1-4-1','1-4-2','1-4-3',
            '1-5-1','1-6-1','1-7-1','1-8-1'
        ] },
        { id: 'part2', label: 'Part 2 · 社会生活场景', units: [
            '2-1-1','2-1-2','2-2-1','2-2-2','2-3-1','2-3-2'
        ] },
        { id: 'part3', label: 'Part 3 · 校园学术场景', units: [
            '3-1-1','3-1-2','3-2-1','3-3-1','3-3-2','3-4-1','3-4-2'
        ] },
        { id: 'part4', label: 'Part 4 · 学术科普场景', units: [
            '4-1-1','4-2-1','4-2-2','4-3-1','4-4-1',
            '4-5-1','4-5-2','4-6-1','4-6-2','4-6-3',
            '4-7-1','4-7-2','4-7-3','4-7-4'
        ] }
    ];

    // 单元名称映射
    const UNIT_NAMES = {
        '1-1-1':'食材食物酒水饮料','1-1-2':'厨房厨具烹饪餐饮',
        '1-2-1':'交通工具','1-2-2':'住宿酒店预订观光','1-2-3':'驾驶路况交通规则',
        '1-3-1':'人体部位生理机能','1-3-2':'情绪心理压力性格','1-3-3':'疾病伤痛医疗诊治','1-3-4':'运动健身休闲锻炼',
        '1-4-1':'房屋户型房间门窗','1-4-2':'家具家电厨卫设备','1-4-3':'维修合同中介规定',
        '1-5-1':'购物与消费','1-6-1':'人际关系','1-7-1':'颜色与日用品','1-8-1':'金融',
        '2-1-1':'岗位求职面试人员','2-1-2':'薪资福利办公培训',
        '2-2-1':'城市场馆公共地点','2-2-2':'治安法律公共制度',
        '2-3-1':'艺术音乐媒体文学','2-3-2':'体育休闲节日活动',
        '3-1-1':'讲座研讨实验调研','3-1-2':'论文写作格式论据',
        '3-2-1':'图书馆借阅复印数据库',
        '3-3-1':'学习方法笔记小组','3-3-2':'考试测验评估备考',
        '3-4-1':'院校院系专业学位','3-4-2':'师生教室实验室学期',
        '4-1-1':'地理学',
        '4-2-1':'地质构造山川岩石','4-2-2':'海岸海洋河湖地貌',
        '4-3-1':'环境保护',
        '4-4-1':'气候气象',
        '4-5-1':'个人品质能力性格','4-5-2':'公司组织会议营销',
        '4-6-1':'各类动物','4-6-2':'动物行为繁殖保护','4-6-3':'植物植被细胞基因',
        '4-7-1':'工程电子航天化学','4-7-2':'农业粮食全球贸易','4-7-3':'历史考古文物哲学','4-7-4':'媒体数学计量IT'
    };

    // 解锁
    function handleUnlock() {
        const input = passwordInput.value.trim();
        if (input === CORRECT_PASSWORD) {
            isUnlocked = true;
            passwordInput.value = '';
            passwordError.textContent = '';
            passwordInput.classList.remove('error');
            lockIcon.textContent = '✅';
            passwordPrompt.textContent = '已解锁，欢迎回来！';
            passwordSuccess.classList.add('show');
            logoutBtn.classList.remove('hidden');
            pronounceSection.classList.remove('hidden');
            unitSection.classList.remove('hidden');
            startSection.classList.remove('hidden');
            renderUnits();
            updateStartButton();
            showToast('✅ 解锁成功，开始练习吧！', 1500);
        } else {
            passwordError.textContent = '❌ 密码错误，请重试';
            passwordInput.classList.add('error');
            passwordInput.value = '';
            passwordInput.focus();
            showToast('❌ 密码错误', 1200);
        }
    }

    function handleLogout() {
        if (!confirm('确定要退出吗？')) return;
        isUnlocked = false;
        selectedUnits.clear();
        passwordInput.value = '';
        passwordError.textContent = '';
        passwordInput.classList.remove('error');
        lockIcon.textContent = '🔒';
        passwordPrompt.textContent = '请输入密码访问';
        passwordSuccess.classList.remove('show');
        logoutBtn.classList.add('hidden');
        pronounceSection.classList.add('hidden');
        unitSection.classList.add('hidden');
        startSection.classList.add('hidden');
        partContainer.innerHTML = '';
        updateUnitCount();
        updateStartButton();
        showToast('已退出', 1000);
    }

    // 发音选择
    document.querySelectorAll('.btn-accent').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.btn-accent').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            accent = this.dataset.accent;
        });
    });

    // 渲染单元
    function renderUnits() {
        let html = '';
        PART_GROUPS.forEach(group => {
            const unitIds = group.units;
            const selectedCount = unitIds.filter(id => selectedUnits.has(id)).length;
            html += `
                <div class="part-group">
                    <div class="part-header" data-part="${group.id}">
                        <span class="part-name">${group.label}</span>
                        <span class="part-meta">
                            <span>${selectedCount}/${unitIds.length}</span>
                            <span class="arrow open">▾</span>
                        </span>
                    </div>
                    <div class="part-body open" data-part="${group.id}">
                        <div class="unit-grid">
            `;
            unitIds.forEach(id => {
                const name = UNIT_NAMES[id] || id;
                const checked = selectedUnits.has(id) ? 'checked' : '';
                html += `
                    <label class="unit-chip">
                        <input type="checkbox" value="${id}" ${checked} data-unit="${id}">
                        <span class="unit-label">${id} ${name}</span>
                    </label>
                `;
            });
            html += `</div></div></div>`;
        });
        partContainer.innerHTML = html;

        document.querySelectorAll('.part-header').forEach(header => {
            header.addEventListener('click', function() {
                const partId = this.dataset.part;
                const body = document.querySelector(`.part-body[data-part="${partId}"]`);
                const arrow = this.querySelector('.arrow');
                if (body) { body.classList.toggle('open'); if (arrow) arrow.classList.toggle('open'); }
            });
        });

        document.querySelectorAll('.unit-chip input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                const id = this.value;
                if (this.checked) selectedUnits.add(id);
                else selectedUnits.delete(id);
                updatePartCounts();
                updateUnitCount();
                updateStartButton();
            });
        });

        document.querySelectorAll('.part-body').forEach(body => body.classList.add('open'));
        document.querySelectorAll('.part-header .arrow').forEach(arrow => arrow.classList.add('open'));
        updatePartCounts();
        updateUnitCount();
    }

    function updatePartCounts() {
        PART_GROUPS.forEach(group => {
            const unitIds = group.units;
            const selectedCount = unitIds.filter(id => selectedUnits.has(id)).length;
            const header = document.querySelector(`.part-header[data-part="${group.id}"]`);
            if (header) {
                const meta = header.querySelector('.part-meta span:first-child');
                if (meta) meta.textContent = `${selectedCount}/${unitIds.length}`;
            }
        });
    }

    function updateUnitCount() {
        unitCount.textContent = `已选 ${selectedUnits.size} 个单元`;
    }

    function updateStartButton() {
        startBtn.disabled = selectedUnits.size === 0;
        if (selectedUnits.size === 0) startBtn.textContent = '开始默写';
        else startBtn.textContent = `开始默写 (${selectedUnits.size} 个单元)`;
    }

    // 开始默写
    function startQuiz() {
        if (selectedUnits.size === 0) { showToast('请至少选择一个单元', 1500); return; }
        // 跳转到 quiz.html，把选中的单元作为参数
        const unitsParam = Array.from(selectedUnits).join(',');
        window.location.href = `quiz.html?units=${unitsParam}&accent=${accent}`;
    }

    // 事件绑定
    unlockBtn.addEventListener('click', handleUnlock);
    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleUnlock(); } });
    logoutBtn.addEventListener('click', handleLogout);
    startBtn.addEventListener('click', startQuiz);

    window.addEventListener('load', () => passwordInput.focus());

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && e.key === 'L') {
            e.preventDefault();
            if (isUnlocked) handleLogout();
        }
    });

    console.log('✅ Reborn新生留学 · 首页已加载');
    console.log('🔒 默认密码: reborn2026');
</script>
</body>
</html>
